name: tw20-data

# 台股 20 日達標分類（tw20）第 1 段：資料接入與小規模 smoke test。
# 只能手動執行；不寫回 repo，結果只存 artifacts（保留 30 天）。不訓練模型。
on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'smoke＝第 1 段小規模檢查；stage2＝A／B 模型與驗證期評估（不評分 2025 以後）'
        type: choice
        options: [smoke, stage2, stage2_extra]
        default: smoke
      source_run:
        description: 'stage2_extra 讀取哪一次 stage2 執行的 artifact（run id）'
        default: '42762827049'
      codes:
        description: 'smoke test 計算 Alpha158 的上市普通股代號（4 碼、逗號分隔、最多 20 檔）'
        default: '2330,2317,2454,2603,2327,1101,2881,2308,2382,2492,1476,3413'

permissions:
  contents: read

concurrency:
  group: tw20-data-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  MLFLOW_DISABLE_AGENT_HINT: "1"
  TWSE_OFFLINE: "1"   # 日 K 與除權息／減資只用 repo 內已存資料；只有變更面額（TWTB7U）會連線抓取
  OUT: tw20_out

jobs:
  smoke:
    if: inputs.stage == 'smoke'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: 分支檢查（只允許 research/tw20）
        if: github.ref != 'refs/heads/research/tw20'
        run: |
          echo "::error::此 workflow 只能在 research/tw20 分支執行（main 上只保留定義，供手動觸發登錄）"
          exit 1
      - name: 輸入檢查
        env:
          CODES: ${{ inputs.codes }}
        run: |
          echo "$CODES" | grep -Eq '^[1-8][0-9]{3}(,[1-8][0-9]{3}){0,19}$' || { echo "::error::codes 必須是 1–20 個上市普通股 4 碼代號，以逗號分隔"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/tw20/requirements.lock
      - name: 安裝鎖定依賴
        run: |
          pip install -r research/tw20/requirements.lock
          mkdir -p "$OUT" && pip freeze > "$OUT/pip-freeze.txt" && python --version > "$OUT/python-version.txt"
      - name: 離線單元檢查
        run: python research/tw20/test_tw20.py
      - name: 變更面額事件（證交所 TWTB7U）
        env:
          TWSE_OFFLINE: ""
        run: python research/tw20/tw20.py events "$OUT"
      - name: 標籤與樣本狀態（全股票池）
        run: python research/tw20/tw20.py labels "$OUT"
      - name: Alpha158（smoke：指定代號）
        env:
          CODES: ${{ inputs.codes }}
        run: python research/tw20/tw20.py features "$OUT" --codes "$CODES"
      - name: 資料檢查與抽查
        run: |
          python research/tw20/tw20.py checks "$OUT" > /dev/null
          cat "$OUT/checks.md" >> "$GITHUB_STEP_SUMMARY"
      - name: 雜湊
        run: |
          python research/tw20/tw20.py hashes "$OUT"
          echo "commit=$GITHUB_SHA run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$OUT/run.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tw20-stage1-smoke
          path: ${{ env.OUT }}
          retention-days: 30

  stage2:
    if: inputs.stage == 'stage2'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: 分支檢查（只允許 research/tw20）
        if: github.ref != 'refs/heads/research/tw20'
        run: |
          echo "::error::此 workflow 只能在 research/tw20 分支執行"
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/tw20/requirements.lock
      - name: 安裝鎖定依賴
        run: |
          pip install -r research/tw20/requirements.lock
          mkdir -p "$OUT" && pip freeze > "$OUT/pip-freeze.txt" && python --version > "$OUT/python-version.txt"
          nproc > "$OUT/nproc.txt" && cat "$OUT/nproc.txt"
      - name: 離線單元檢查
        run: python research/tw20/test_tw20.py && python research/tw20/test_stage2.py
      - name: 變更面額事件（證交所 TWTB7U）
        env:
          TWSE_OFFLINE: ""
        run: python research/tw20/tw20.py events "$OUT"
      - name: 標籤與樣本狀態
        run: python research/tw20/tw20.py labels "$OUT"
      - name: Alpha158（全部曾入池個股）
        run: python research/tw20/tw20.py features "$OUT" 2>&1 | tail -3
      - name: B 特徵
        run: python research/tw20/stage2.py bfeat "$OUT"
      - name: 資料檢查
        run: python research/tw20/tw20.py checks "$OUT" > /dev/null
      - name: 負向對照（標籤打亂）
        run: python research/tw20/stage2.py run "$OUT" --placebo > "$OUT/placebo.log" 2>&1; sed -n '/^# tw20/,/^## 重要特徵/p' "$OUT/placebo.log"
      - name: A／B 訓練與驗證期評估
        run: |
          python research/tw20/stage2.py run "$OUT"
          cat "$OUT/stage2/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: 雜湊與交接檔
        run: |
          python research/tw20/tw20.py hashes "$OUT"
          cp research/tw20/HANDOFF.md research/tw20/protocol.json "$OUT/"
          rm -rf "$OUT/qlib_data"
          echo "commit=$GITHUB_SHA run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$OUT/run.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tw20-stage2
          path: ${{ env.OUT }}
          retention-days: 90

  stage2_extra:
    if: inputs.stage == 'stage2_extra'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - name: 分支與輸入檢查
        env:
          SRC: ${{ inputs.source_run }}
        run: |
          [ "$GITHUB_REF" = "refs/heads/research/tw20" ] || { echo "::error::只能在 research/tw20 分支執行"; exit 1; }
          echo "$SRC" | grep -Eq '^[0-9]{6,15}$' || { echo "::error::source_run 必須是數字 run id"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/tw20/requirements.lock
      - name: 安裝鎖定依賴
        run: pip install -r research/tw20/requirements.lock
      - name: 取得第 2 段 artifact（不重訓）
        uses: actions/download-artifact@v4
        with:
          name: tw20-stage2
          path: ${{ env.OUT }}
          run-id: ${{ inputs.source_run }}
          github-token: ${{ github.token }}
      - name: 核對凍結模型與 repo 內 frozen.json 一致
        run: |
          python - <<'PY'
          import hashlib, json, os
          out = os.environ["OUT"]
          a = json.load(open(f"{out}/stage2/frozen.json")); b = json.load(open("research/tw20/results/stage2/frozen.json"))
          for k in ("A", "B"):
              h = hashlib.sha256(open(f"{out}/stage2/model_{k}.txt", "rb").read()).hexdigest()
              assert h == a["models"][k]["sha256"] == b["models"][k]["sha256"], k
          assert a["thresholds"] == b["thresholds"] and a["primary"] == b["primary"]
          print("模型雜湊、門檻、主要候選皆一致")
          PY
      - name: 補充分析
        run: |
          python research/tw20/stage2_extra.py "$OUT" 2>&1 | grep -v PerformanceWarning
          cat "$OUT/stage2_extra/summary.md" >> "$GITHUB_STEP_SUMMARY"
          echo "source_run=${{ inputs.source_run }} commit=$GITHUB_SHA run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$OUT/stage2_extra/run.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tw20-stage2-extra
          path: ${{ env.OUT }}/stage2_extra
          retention-days: 90
