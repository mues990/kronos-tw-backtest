name: timing

# timing v1：進出場擇時與警示（規格 research/timing/protocol.json）。只能手動、只在 research/timing 分支執行；不寫回 repo。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timing-${{ github.ref }}

env:
  PYTHONUNBUFFERED: "1"
  TWSE_OFFLINE: "1"

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: 分支檢查
        run: '[ "$GITHUB_REF" = "refs/heads/research/timing" ] || { echo "::error::只能在 research/timing 分支執行"; exit 1; }'
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas==2.2.3 numpy==2.2.6 pyarrow tabulate yfinance==0.2.66
      - run: python research/timing/test_timing.py
      - name: 上市前 150 檔（開發期與驗證期）
        run: python research/timing/timing.py universe out 2> out_err.log
      - run: cat out/universe.md out/pool.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timing-v1
          path: out
          retention-days: 90
