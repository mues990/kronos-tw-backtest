name: selected-pool

# selected pool 的基準勝率與出場規則比較（探索性）。只能手動執行；不寫回 repo，結果存 artifact。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pool-${{ github.ref }}

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance==0.2.66 pandas==2.2.3 pyarrow tabulate
      - run: |
          python research/pool/pool.py pool_out > /dev/null
          cat pool_out/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selected-pool
          path: pool_out
          retention-days: 90
